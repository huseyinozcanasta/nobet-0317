{"id":"pulmrenal","n":"09","title":"Akciğerden Böbreğe","tag":"PULMONER-RENAL SENDROM","patient":"R. / 46 yaş","subtitle":"Yeni hemoptizi • hematüri • hızlı kreatinin artışı","accent":"#a6b3ff","priority":"ORGAN TEHDİDİ","intro":"Üç haftalık halsizlik/sinüzit ardından hemoptizi ve dispne başladı. Son bir ayda kreatinin 0,9’dan 3,4’e yükseldi. İdrarda eritrosit silendirleri görülüyor; toraks BT’de bilateral buzlu cam alanları.","vitals":{"HR":"124","BP":"152/94","SpO2":"88%","RR":"32"},"labs":[["Kreatinin","3,4 mg/dL ↑"],["TİT","Eritrosit silendirleri"],["Hb","9,1 g/dL ↓"],["Toraks BT","Bilateral opasiteler"]],"fbt":"FBT #99 • s.24; #130 • s.30; #53 • s.13","difficulty":"UZMAN","steps":[{"q":"Bu hastanın iki organını birleştiren acil sendrom?","options":[["Pulmoner-renal sendrom: olası alveoler hemoraji ve hızla ilerleyen glomerülonefrit.",2,"İsabetli. Hemoptizi/hipoksemi ve eritrosit silendiriyle hızla bozulan böbrek fonksiyonu küçük damar vasküliti veya anti-GBM hastalığı açısından acildir."],["Sadece üriner taş ve bağımsız viral rinit.",0,"Bu yaklaşım önceliği kaçırır. Hemoptizi/hipoksemi ve eritrosit silendiriyle hızla bozulan böbrek fonksiyonu küçük damar vasküliti veya anti-GBM hastalığı açısından acildir."],["Bronşit + dehidratasyon; silendirleri önemsemem.",0,"Bu seçenek eksik veya tehlikeli olabilir. Hemoptizi/hipoksemi ve eritrosit silendiriyle hızla bozulan böbrek fonksiyonu küçük damar vasküliti veya anti-GBM hastalığı açısından acildir."],["Hematüriyi otomatik alt ÜSE kabul edip akciğeri ayrı izlerim.",0,"Bu karar klinik tabloyla bağdaşmıyor. Hemoptizi/hipoksemi ve eritrosit silendiriyle hızla bozulan böbrek fonksiyonu küçük damar vasküliti veya anti-GBM hastalığı açısından acildir."]],"why":"Hemoptizi/hipoksemi ve eritrosit silendiriyle hızla bozulan böbrek fonksiyonu küçük damar vasküliti veya anti-GBM hastalığı açısından acildir.","source":8},{"q":"İlk tanısal set ve danışma yaklaşımı?","options":[["Acil nefroloji/romatoloji/yoğun bakım; idrar mikrosk uk planlamak"],["Obstrüksiyonda ERCP ile erken biliyer drenajı sağla","Antibiyotiğe tam yanıtı bekleyip drenajı ertelemek","Analjeziyi artırıp obstrüksiyonun açılmasını izlemek","Açık cerrahiyi rutin ilk kaynak kontrolü saymak"]],"ttp":[["Şistositli hemoliz ve trombositopeni: TTP olasılığı","Normal koagülasyon testlerine rağmen DIC kesin tanısı","Mikrositer demir eksikliğiyle şistositleri açıklamak","Tek başına İTP ile hemolitik anemiyi açıklamak"],["ADAMTS13 örneği ardından acil plazma değişim planı","ADAMTS13 laboratuvar sonucunu bekleyerek izlem","Trombosit sayısını öncelikle transfüzyonla düzeltmek","Oral demir başlanıp ayaktan kontrol verilmesi"],["TTP'de koagülasyon çoğu kez normal; DIC'de bozulma beklenebilir","Normal PT ve aPTT varlığıyla TTP'yi dışlamak","Şistosit olmayacağını kabul edip TTP'den uzaklaşmak","Ateş bulunmadığından TTP'yi olasılık dışı saymak"]],"pulmrenal":[["Alveoler hemoraji ve hızlı GN: pulmoner-renal","Üriner taş ve viral enfeksiyonun eşzamanlı seyri","Bronşit-dehidratasyon ikilisinin tek başına açıklaması","Alt ÜSE ile akciğer infiltrasyonunu ayrı izlemek"],["ANCA/anti-GBM, idrar mikroskopisi ve acil nefroloji/yoğun bakım","Yalnız tekrar idrar testi için iki hafta sonra çağırmak","PR3-ANCA negatifliğinde tüm vaskülitleri dışlamak","Hemoptiziyi öksürük tedavisiyle semptomatik izlemek"],["Organ tehdidinde erken immünsüpresyon ve destek","Antibiyotik verip ayaktan kontrol programı kurmak","Biyopsi sonuçlanana dek kritik bakımı ertelemek","Proteinüri azalana kadar girişimsiz izlem yapmak"]],"adrenal":[["Steroid kesilmesinde adrenal kriz/şok ihtimali","Eşlik eden hipotansiyonu panik atağa bağlamak","Taşikardiye bakıp primer hipertansif krizi düşünmek","Kusmayı basit hiperventilasyon sonucu saymak"],["IV stres doz hidrokortizon ve acil şok desteği","ACTH uyarı testini bekleyip tedaviyi sonra vermek","Semptomları antihistaminikle kontrol etmeyi denemek","Oral destekle elektif poliklinik kontrolü planlamak"],["Sekonder yetmezlikte aldosteron kor const CASE_TEACH={"hyperk":{"mechanism":"Hiperkalemide membran potansiyeli değişir; PR uzaması, QRS genişlemesi ve ritim bozukluğu riski ortaya çıkabilir. IV kalsiyum, miyokard membranını stabilize eder; serum potasyumunu düşürmez. İnsülin-glukoz hücre içine geçici kaydırma yapar; potasyumun bedenden uzaklaştırılması ayrıca planlanır.","pitfall":"Normalleşen EKG, potasyumun normale geldiğini tek başına kanıtlamaz. Rebound, hipoglisemi ve dirençli hiperkalemi riski devam eder.","follow":"Hocan: EKG düzelmiş ama potasyum 6,8 ise taburcu eder misin? Neden?","answer":"Hayır. Ritmin düzelmesi hiperkaleminin çözüldüğünü kanıtlamaz; yakın K⁺/glukoz/ritim izlemi, uzaklaştırma ve dirençli tabloda acil nefroloji-diyaliz değerlendirmesi gerekir.","rubrics":[["EKG değişikliği ile zaman kritik ağır hiperkalemi riskini adlandırdım.","IV kalsiyumun potasyumu düşürmeden kalbi koruduğunu açıkladım."],["Potasyumun hücre içine kaydırılmasını ve vücuttan uzaklaştırılmasını ayırdım.","İnsülin sonrası glukoz/K⁺ izlemini ve rebound riskini belirttim."],["Dirençli K⁺ yüksekliğini tedavi başarısızlığı kabul ettim.","Diyaliz gereksinimi ve yeniden EKG/K⁺ izlemini söyledim."]]},"dka":{"mechanism":"İnsülin eksikliği ketogenez ve anyon açıklı metabolik asidoz yapar. İnsülin verildiğinde potasyum hücre içine kayar; başlangıç potasyumu düşük olan hastada ağır hipokalemi ve aritmi gelişebilir. Glukoz düşmesi ketozun bittiği anlamına gelmez.","pitfall":"Tek bir glukoz değeri değil, ketonemi, asit-baz dengesi ve elektrolitler beraber izlenir. Düşük potasyum insülin zamanlamasını değiştirir.","follow":"Glukoz 190 ama pH hâlâ 7,20: insülini kesmek hangi komplikasyona yol açabilir?","answer":"Ketogenez ve asidoz devam edebilir. Protokole uygun dekstrozla insülini sürdürmek ve K⁺/keton/pH izlemini sürdürmek gerekir.","rubrics":[["DKA'yı keton ve asidozla tanımladım.","K⁺ 3,1 mmol/L iken insülinin ertelenme gerekçesini açıkladım."],["Sıvı, insülin, potasyum ve tetikleyici nedeni birlikte ele aldım.","Seri ölçümlerle tedavi yanıtını izlemenin gerekçesini belirttim."],["Glukoz normalleşmesi ile DKA çözülmesini ayırdım.","Dekstrozla insülinin sürdürülmesini açıkladım."]]},"aki":{"mechanism":"Anüriye glob vezikale eşlik etmesi postrenal obstrüksiyon olasılığını artırır. Drenaj sonrası postobstrüktif diürez gelişebilir; sodyum, potasyum, sıvı dengesi ve böbrek işlevi izlenmelidir.","pitfall":"Obstrüksiyon çözülmesi AKI'yi anında iyileştirmez. KDIGO evrelemesinde karşılanan en ağır kreatinin veya idrar çıkışı kriteri esas alınır.","follow":"Hasta sondadan sonra saatlerce çok idrar yapıyorsa neden güvenle eve gönderemezsin?","answer":"Postobstrüktif diürez ve elektrolit/sıvı kaybı gelişebilir; idrar çıkışı, elektrolitler, hemodinami ve kreatinin yakın izlenmelidir.","rubrics":[["Anürinin postrenal nedenini glob vezikale ile ilişkilendirdim.","Mesane değerlendirmesi ve uygun drenaj planını belirttim."],["Postobstrüktif diürezi öngördüm.","Sıvı-elektrolit/kreatinin izlemini belirttim."],["Bazal kreatinine göre ≥3 kat artışı hesapladım.","≥12 saat anüri ile evre 3 kriterini eşledim."]]},"sepsis":{"mechanism":"Sepsiste disregüle konak yanıtı organ disfonksiyonu; septik şokta ciddi dolaşım/metabolik bozukluk yaratır. Kaynak kontrolü, uygun antibiyotik, perfüzyon desteği ve sık yeniden değerlendirme eşzamanlı ilerler.","pitfall":"Tek başına ateş, SpO₂ ya da CRP şok çözülmesini göstermeye yetmez. Sıvı yüklemek kadar, sıvı yanıtını sorgulamak da önemlidir.","follow":"Laktat yüksekliği tek başına her zaman daha fazla sıvı vermen gerektiğini kanıtlar mı?","answer":"Hayır. Klinik perfüzyon, sıvı yanıtı, kalp/akciğer bulguları ve diğer laktat nedenleri birlikte değerlendirilmelidir.","rubrics":[["Şok bulgularını (hipotansiyon, hipoperfüzyon, laktat) tanıdım.","Erken antibiyotik, uygun sıvı ve kültür/kaynak kontrolünü sıraladım."],["MAP düşükken vazopresör gereksinimini söyledim.","Tekrarlayan kör sıvı bolusunun sakıncasını açıkladım."],["En az üç perfüzyon göstergesi saydım.","Eşzamanlı enfeksiyon odağı kontrolünü hatırlattım."]]},"neuro":{"mechanism":"Epidural hematom dural arter kanamasıyla ilişkilidir; bikonveks görünüm karakteristiktir. Bilinçte hızla bozulma ve anizokori artan kitle etkisi/herniasyon tehlikesini düşündürür.","pitfall":"Genç yaş ya da kısa süre konuşabilmiş olması güven vermez; hava yolu ve hızlı nöroşirürji kararının önemini azaltmaz.","follow":"Hangi iki klinik bulgu BT'deki epidural hematomu daha acil hâle getiriyor?","answer":"Düşük GKS (özellikle koma) ve anizokori; klinik kötüleşme ile birlikte hızla cerrahi değerlendirme gerekir.","rubrics":[["Bikonveks BT ve travmayı epidural hematomla eşledim.","ABC/airway ve acil nöroşirürji önceliğini söyledim."],["GKS düşüklüğünü ve anizokoriyi belirttim.","Herniasyon ve acil boşaltım gereğini açıkladım."]]},"edk":{"mechanism":"SGLT2 inhibitörleri glukozüri yaparak glukoz yüksekliğini maskeleyebilir; ketonemi ve anyon açıklı asidoz belirgin olabilir. DKA tanısında keton ve asit-baz değerlendirmesi, yalnız glukoz düzeyinden daha belirleyicidir.","pitfall":"Glukozun 168 veya 145 olması ketozun çözüldüğünü göstermez. Keton temizlenene kadar izlemde insülin ve uygun dekstroz birlikte gerekebilir.","follow":"Glukoz düşük-normal ama pH ve keton anormal ise insülinin neden dekstrozla sürdürülmesi gerekir?","answer":"Hedef ketogenez ve asidozu sonlandırmaktır; dekstroz hipoglisemiyi önleyerek insülini uygun şekilde sürdürmeyi sağlar.","rubrics":[["SGLT2 maruziyeti, asidoz ve ketonemiyi birlikte yorumladım.","Açlık ketozu/HHS ile ayırıcı tanıyı söyledim."],["SGLT2 kesilmesi, sıvı ve insülin-dekstroz yaklaşımını sıraladım.","Elektrolit ve seri keton/pH izlemini söyledim."],["Glukozun normal olmasının iyileşme demek olmadığını açıkladım.","Ketoz ve asidoz çözülme ölçütünü belirttim."]]},"cholang":{"mechanism":"Enfekte ve tıkalı safra yollarında bilirubin/kolestaz bulguları sepsisle birleşebilir. Yaşlı ve kritik hastalarda klasik sağ üst kadran ağrısı belirgin olmayabilir; görüntüleme ve organ disfonksiyonu önemlidir.","pitfall":"Ağrı yokluğu kolanjiti dışlamaz; antibiyotik tek başına tıkalı-enfekte biliyer sistemi yeterince kontrol etmeyebilir.","follow":"Ateş, sarılık ve hipotansiyon varken sağ üst kadran ağrısı yoksa kolanjit düşünmeyi neden sürdürürsün?","answer":"Ağrı özellikle yaşlı/kritik hastada atipik olabilir. Kolestaz, dilate koledok ve dolaşım/bilinç bozukluğu ağır kolanjit lehinedir.","rubrics":[["Kolestaz + obstrüksiyon + organ disfonksiyonunu ilişkilendirdim.","Yaşlı hastada ağrısız ağır kolanjit olasılığını anlattım."],["Kültür ve acil antibiyotik/perfüzyon desteğini sıraladım.","ERCP/kaynak kontrolü için erken ekip iletişimini belirttim."],["Obstrüksiyon çözülmezse antibiyotikle yetinilemeyeceğini söyledim.","ERCP ile erken drenajı ve eşzamanlı stabilizasyonu açıkladım."]]},"ttp":{"mechanism":"TTP'de ciddi ADAMTS13 eksikliği ultrabüyük vWF multimerleri üzerinden mikrotrombüs ve mikroanjiyopatik hemolize neden olur. Şistosit, LDH artışı, trombositopeni ve değişken nörolojik/böbrek bulguları destekler.","pitfall":"Klasik beşli tüm hastalarda bulunmaz. Normal PT/aPTT TTP'yi dışlamaz; ağır şüphede ADAMTS13 test sonucu beklenerek acil tedavi geciktirilmez.","follow":"DIC ile TTP'yi yatak başında nasıl ayırmaya başlarsın; hangi bulgu kesin tek başına tanı koydurmaz?","answer":"PT/aPTT, fibrinojen, D-dimer ve organ bulgularını birlikte ele alırım. Normal koagülasyon TTP lehine olabilir ama tek başına kesin tanı değildir.","rubrics":[["MAHA, şistosit ve trombositopeni kombinasyonunu kurdum.","TTP ile DIC/İTP ayrımını söyleyebildim."],["ADAMTS13 örneğini tedaviden önce almanın gerekçesini söyledim.","Plazma değişiminin geciktirilmemesini belirttim."],["Koagülasyon testleri ile TTP/DIC karşılaştırması yaptım.","Tek ölçüm yerine bütüncül ayırıcı tanıyı savundum."]]},"pulmrenal":{"mechanism":"Eritrosit silendirleri glomerüler kaynaklı kanamayı düşündürür; hemoptizi ve bilateral opasitelerle birlikteliği diffüz alveoler hemoraji ve hızla ilerleyen GN açısından alarmdır. ANCA vasküliti ve anti-GBM hastalığı farklı ama zaman kritik ayırıcı tanılardır.","pitfall":"Serolojinin negatifliği tek başına bütün vaskülitleri dışlamaz; enfeksiyon taklidi ve biyopsi kararı uzman gözetimiyle değerlendirilmelidir.","follow":"Eritrosit silendiri ile dipstick hematüri arasında neden tanısal ağırlık farkı vardır?","answer":"Silendir renal tübüllerde şekillendiği için glomerüler/renal parankimal kanamayı daha güçlü düşündürür; dipstick pozitifliği tek başına kanamanın yerini göstermez.","rubrics":[["Hemoptizi + böbrek yetmezliği + silendiri aynı sendromda topladım.","Alveoler hemoraji ve hızlı GN aciliyetini belirttim."],["ANCA ve anti-GBM dahil hedef testleri sıraladım.","Yoğun bakım/nefroloji konsültasyonunu geciktirmemeyi söyledim."],["Organ tehdidinde hızlı tedavi kararını vurguladım.","Enfeksiyon ve olası biyopsinin eşzamanlı değerlendirilmesini belirttim."]]},"adrenal":{"mechanism":"Uzun süreli glukokortikoid tedavisi hipotalamus-hipofiz-adrenal aksı baskılayabilir. Ani kesilme ve interkurrent hastalıkta kortizol gereksinimi karşılanamaz; hipotansiyon, hiponatremi ve hipoglisemi olabilir.","pitfall":"Sekonder/tersiyer yetmezlikte renin-anjiyotensin-aldosteron aksı görece korunabildiği için hiperkalemi bulunmaması adrenal krizi dışlamaz.","follow":"Potasyum normal olsa bile neden steroid kesilmesine bağlı adrenal krizden şüphelenirsin?","answer":"Eksojen steroid hipofiz-ACTH eksenini baskılar; aldosteron genellikle korunduğu için ağır hiperkalemi zorunlu değildir.","rubrics":[["Steroid kesilmesini olası HPA aks baskılanmasıyla eşledim.","Sepsisin eş zamanlı olabileceğini söyledim."],["Stres dozu steroid ve sıvı/glukoz desteğini belirttim.","Laboratuvar nedeniyle tedaviyi geciktirmemeyi söyledim."],["Aldosteronun primer-sekonder farkını açıkladım.","Normal K⁺'nın adrenal krizi dışlamadığını belirttim."]]},"sbp":{"mechanism":"Asit sıvısında PMN ≥250/mm³, kültür negatif olsa da spontan bakteriyel peritonit için tanısal eşiği function due(){
 let a=[];
 for(const c of DATA){
  (session.results[c.id]||[]).forEach((r,j)=>{
   const o=(session.oralRecords[c.id]||[])[j];
   const oralPoor=o&&Array.isArray(o.checks)&&o.selfScore<o.checks.length;
   if(r.score<2||oralPoor||!o||!Array.isArray(o.checks))a.push({id:c.id,step:j,why:r.score<2?'Klinik karar eksiği':'Sözlü gerekçe veya kontrol eksikliği'});
  });
 }
 if(!a.length)for(const c of DATA)if((session.results[c.id]||[]).length)a.push({id:c.id,step:0,why:'Gecikmeli aktif hatırlama'});
 return a;
}
